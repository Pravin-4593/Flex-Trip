{% extends "base.html" %}

{% block css %}
<link rel="stylesheet"
href="{{ url_for('static', filename='css/edit_profile.css') }}">
{% endblock %}

{% block content %}

<div class="edit-profile">

    <h1>Edit Profile</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" enctype="multipart/form-data">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        {% if profile_url %}
            <div class="profile-img">
                <img src="{{ profile_url }}" alt="Profile Picture">
            </div>
        {% endif %}

        <label>Profile Picture</label>
        <input
            type="file"
            name="profile_picture"
            accept="image/*">

        <label>Username</label>

        <input
            type="text"
            name="username"
            value="{{ username }}"
            maxlength="50"
            required>

        <label>Bio</label>

        <textarea
            name="bio"
            rows="5"
            maxlength="500">{{ bio }}</textarea>

        <div class="button-row">

            <div class="left-buttons">
                <button type="submit">
                    Save Changes
                </button>

                <a href="{{ url_for('profile') }}">
                    Cancel
                </a>
            </div>

    </form>

            <form
                action="{{ url_for('delete_account') }}"
                method="POST"
                onsubmit="return confirm('Are you sure you want to delete your account? This action cannot be undone.');">

                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <button
                    type="submit"
                    class="delete-btn">
                    Delete Account
                </button>

            </form>

        </div>

</div>

{% endblock %}
